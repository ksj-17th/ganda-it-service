# log_format mft_combined '$remote_addr - $remote_user [$time_local] '
#                         '"$request" $status $body_bytes_sent '
#                         '"$http_referer" "$http_user_agent" '
#                         'request_id=$request_id rt=$request_time';

log_format mft_json escape=json '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr","remote_user":"$remote_user","request":"$request","request_method":"$request_method","request_uri":"$request_uri","status":$status,"body_bytes_sent":$body_bytes_sent,"http_referer":"$http_referer","http_user_agent":"$http_user_agent","request_id":"$request_id","request_time":$request_time}';

server {
    listen 80;
    server_name _;
    client_max_body_size 0;
    root /var/www/html;
    index index.php;

    # access_log /var/log/nginx/access.log mft_combined;
    access_log /var/log/nginx/access.log mft_json;
    error_log  /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass php:9000;
    }
}
